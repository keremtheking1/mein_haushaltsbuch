<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Haushaltsbuch</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2058ad"><meta name="apple-mobile-web-app-capable" content="yes">
<style>body{font-family:system-ui;background:#f4f6fa;color:#172334;max-width:760px;margin:auto;padding:20px}section{background:white;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 12px #0001}input,select,button{padding:12px;margin:5px 0;border:1px solid #ccd3dd;border-radius:9px;box-sizing:border-box;width:100%}button{background:#2058ad;color:white;border:0;cursor:pointer}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.entry{border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between;gap:8px}.muted{color:#687386}.positive{color:#137b45}.negative{color:#b53b3b}</style>
<h1>💶 Mein Haushaltsbuch</h1><section><label>Monat <input type="month" id="month"></label><div id="summary"></div></section>
<section><h2>＋ Buchung hinzufügen</h2><form id="form"><div class="row"><select id="kind"><option value="expense">Ausgabe</option><option value="income">Einnahme</option></select><input id="amount" type="number" min=".01" step=".01" placeholder="Betrag €" required></div><input id="date" type="date" required><input id="label" placeholder="Beschreibung, z. B. Edeka" required><select id="category"></select><div class="row"><select id="repeat"><option value="once">Einmalig</option><option value="monthly">Monatlich wiederkehrend</option></select><button>Speichern</button></div></form><input id="newcat" placeholder="Neue Kategorie"><button id="addcat">＋ Kategorie hinzufügen</button></section>
<section><h2>Ausgaben nach Kategorie</h2><div id="categories"></div></section><section><h2>Buchungen im Monat</h2><div id="entries"></div></section><section><button id="export">Daten als JSON sichern</button><input type="file" id="import" accept=".json"><p class="muted">Die Daten bleiben lokal in diesem Browser. Bitte regelmäßig sichern. Wiederkehrende Buchungen werden ab ihrem Startmonat angezeigt.</p></section>
<script>
const KEY='haushalt-v1';let state=JSON.parse(localStorage.getItem(KEY)||'{"items":[],"cats":["Wohnen","Miete","Fernwärme","Strom","Telefon","Lebensmittel","Auto","Versicherungen","Kleidung","Reisen","Freizeit","Gesundheit","Sonstiges","Gehalt"]}');
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),money=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'}),ym=d=>d.slice(0,7);
$('month').value=new Date().toISOString().slice(0,7);$('date').value=new Date().toLocaleDateString('sv-SE');
function render(){let old=$('category').value;$('category').innerHTML='';state.cats.forEach(c=>{let o=document.createElement('option');o.textContent=c;$('category').append(o)});if(state.cats.includes(old))$('category').value=old;
let m=$('month').value,items=state.items.filter(x=>x.repeat==='monthly'?ym(x.date)<=m:ym(x.date)===m);
let inc=items.filter(x=>x.kind==='income').reduce((s,x)=>s+x.amount,0),out=items.filter(x=>x.kind==='expense').reduce((s,x)=>s+x.amount,0);
$('summary').innerHTML=`<p>Einnahmen: <b class="positive">${money(inc)}</b></p><p>Ausgaben: <b class="negative">${money(out)}</b></p><h2>Saldo: ${money(inc-out)}</h2>`;
let sums={};items.filter(x=>x.kind==='expense').forEach(x=>sums[x.category]=(sums[x.category]||0)+x.amount);
$('categories').replaceChildren();Object.entries(sums).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{let p=document.createElement('p');p.textContent=`${c}: ${money(v)} (${out?(100*v/out).toFixed(1):0} %) `;$('categories').append(p)});
$('entries').replaceChildren();items.sort((a,b)=>b.date.localeCompare(a.date)).forEach(x=>{let div=document.createElement('div');div.className='entry';let span=document.createElement('span');span.textContent=`${x.label} · ${x.category} · ${x.date}${x.repeat==='monthly'?' · monatlich':''}`;let right=document.createElement('span');right.textContent=(x.kind==='expense'?'−':'+')+money(x.amount)+' ';let btn=document.createElement('button');btn.textContent='✕';btn.style.width='auto';btn.onclick=()=>{if(confirm('Buchung löschen?')){state.items=state.items.filter(i=>i.id!==x.id);save();render()}};right.append(btn);div.append(span,right);$('entries').append(div)})}
$('form').onsubmit=e=>{e.preventDefault();state.items.push({id:crypto.randomUUID(),kind:$('kind').value,amount:Number($('amount').value),date:$('date').value,label:$('label').value.trim(),category:$('category').value,repeat:$('repeat').value});save();$('amount').value='';$('label').value='';render()};
$('addcat').onclick=()=>{let c=$('newcat').value.trim();if(c&&!state.cats.includes(c)){state.cats.push(c);save();render();$('category').value=c}$('newcat').value=''};
$('month').onchange=render;$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='haushaltsbuch-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('import').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.items)||!Array.isArray(data.cats))throw Error();if(confirm('Vorhandene Daten durch Backup ersetzen?')){state=data;save();render()}}catch{alert('Ungültige Backup-Datei')}};
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
